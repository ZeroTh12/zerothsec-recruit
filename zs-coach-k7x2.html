<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#0a0a0a">
  <title>ZS Console</title>
  <link rel="stylesheet" href="assets/css/main.css?v=20261105">
  <link rel="stylesheet" href="assets/css/at-template.css?v=20261109">
  <link rel="stylesheet" href="assets/css/writeup.css?v=20261117j">
  <style>
    .rev-card { border: 1px solid var(--line); background: var(--ink-2); padding: 14px 16px; margin-bottom: 14px; }
    .rev-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
    .rev-body { white-space: pre-wrap; font: 400 12.5px/1.7 var(--font-mono); color: var(--bone); background: #050505; border: 1px solid var(--line); padding: 12px; max-height: 420px; overflow: auto; margin-bottom: 8px; }
    .rev-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .rev-actions input { background: #050505; color: var(--bone); border: 1px solid var(--line); padding: 7px 9px; font: 400 12px var(--font-mono); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0; }
    .toolbar input[type=search] { flex: 1; min-width: 200px; background: #050505; color: var(--bone); border: 1px solid var(--line); padding: 9px 12px; font: 400 12px var(--font-mono); }
    .secret-note { color: var(--red); font: 600 12px/1.7 var(--font-mono); }
    .drop-zone { border: 1px dashed var(--line-strong); padding: 26px; text-align: center; color: var(--muted); margin: 14px 0; }
    .drop-zone.on { border-color: var(--acid); color: var(--acid); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#" aria-label="ZS Console">
        <span class="brand-text">
          <span class="brand-name">ZS·CONSOLE</span>
          <span class="brand-sub">ZEROTHSEC Writeup 管理页 · 内部</span>
        </span>
      </a>
      <div class="head-actions">
        <span class="status"><i class="status-dot"></i>PRIVATE</span>
        <a class="btn btn-small" href="writeup.html">返回学生站 ↗</a>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="content-section wp-section">
      <div class="wrap">
        <span class="kicker">WRITEUP 管理 / 收件箱 + 增删改查 + AI 辅助审核</span>
        <p class="secret-note">此页地址请勿外发。收到的 .md 拖进下方收件箱即可审核；数据缓存在本浏览器，结论不会丢。</p>

        <div class="drop-zone" id="drop">
          把 QQ 群收到的 <b>&lt;姓名&gt;-&lt;题号&gt;.md</b> 文件拖到这里（可多选）·
          <label style="color:var(--acid);cursor:pointer;">或选择文件<input type="file" id="picker" multiple accept=".md,.markdown,.txt" style="display:none"></label>
          · 也可 <button class="wp-btn is-mini" type="button" id="toggle-paste" style="display:inline-block;">粘贴文本</button>
        </div>
        <div id="paste-box" hidden class="wp-field" style="margin-bottom:14px;">
          <textarea id="paste-area" class="wp-writeup-area" rows="5" placeholder="粘贴 Writeup 文本（含 ZSWP 头，或标题行 <姓名>-<题号>.md）"></textarea>
          <button class="wp-btn is-mini" type="button" id="parse-paste">解析并加入收件箱</button>
        </div>

        <div class="toolbar">
          <input type="search" id="q" placeholder="搜索：姓名 / 题号…">
          <button class="wp-btn is-mini" type="button" id="refresh">⟳ 刷新</button>
          <button class="wp-btn is-mini" type="button" id="ai-copy">🤖 复制待审 AI 包</button>
          <button class="wp-btn is-mini" type="button" id="ai-import">📥 导入 AI 结论</button>
          <button class="wp-btn is-mini" type="button" id="sync-btn">☁ 拉取仓库 submissions/</button>
        </div>

        <div id="list"><p class="wp-muted">收件箱为空。</p></div>

        <div class="wp-auth" style="margin-top:22px;">
          <h3 class="wp-task-title">审核结果发布</h3>
          <p class="wp-muted">逐题「通过/打回」后点「复制发布包」，把内容发给助手（或自己运行发布命令），学生端即显示结果与排行榜。</p>
          <textarea id="export" class="wp-writeup-area" rows="8" readonly></textarea>
          <button class="wp-btn is-mini is-primary" type="button" id="copy-out">复制发布包（results.json）</button>
          <button class="wp-btn is-mini" type="button" id="dl-out">下载文件</button>
        </div>
      </div>
    </section>
  </main>

  <script src="assets/js/wp-config.js?v=20261117f"></script>
  <script src="assets/js/bank.js?v=20261117b"></script>
  <script src="assets/data/bank.enc.js?v=20261117e"></script>
  <script>
  (function () {
    "use strict";
    var CFG = window.WP_CONFIG || {};
    var SUB = CFG.subDir || "submissions";
    var RELAY = (CFG.relay || "").replace(/\/+$/, "");
    var $ = function (s) { return document.querySelector(s); };
    var bank = null, files = [], queueNote = "";

    /* ---------- 本地收件箱（localStorage，关页不丢） ---------- */
    var LS_FILES = "zs-coach-files", LS_ENTRIES = "zs-coach-entries";
    function boxFiles() { try { return JSON.parse(localStorage.getItem(LS_FILES) || "{}"); } catch (e) { return {}; } }
    function saveBoxFiles(m) {
      try { localStorage.setItem(LS_FILES, JSON.stringify(m)); return true; }
      catch (e) { alert("浏览器缓存已满：请先在收件箱删除已发布的旧文件"); return false; }
    }
    function boxEntries() { try { return JSON.parse(localStorage.getItem(LS_ENTRIES) || "[]"); } catch (e) { return []; } }
    var entries = boxEntries();
    function saveEntries() { try { localStorage.setItem(LS_ENTRIES, JSON.stringify(entries)); } catch (e) { /* ignore */ } }

    function b64(str) {
      var bytes = new TextEncoder().encode(str), bin = "";
      for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }
    function ghAnon(path) {
      return fetch("https://api.github.com" + path, { headers: { Accept: "application/vnd.github+json" } });
    }
    function chById(id) { return bank && (bank.challenges || []).find(function (c) { return c.id === id; }) || null; }
    function parseMd(text, filename) {
      var meta = { id: "", name: "", github: "", direction: "" };
      var m = (text || "").match(/<!--ZSWP([\s\S]*?)-->/);
      if (m) ["id", "name", "github", "direction"].forEach(function (k) {
        var mm = m[1].match(new RegExp("^\\s*" + k + "\\s*:\\s*(.+)$", "m"));
        if (mm) meta[k] = mm[1].trim();
      });
      if (!meta.id || !meta.name) {
        var fm = (filename || "").match(/^(.+)-((?:WEB|CRYPTO|MISC|REVERSE|PWN)-\d+)\.md$/i);
        if (fm) { meta.name = meta.name || fm[1]; meta.id = meta.id || fm[2].toUpperCase(); }
      }
      if (!meta.id) {
        var tm = (text || "").match(/((?:WEB|CRYPTO|MISC|REVERSE|PWN)-\d+)/i);
        if (tm) meta.id = tm[1].toUpperCase();
      }
      return meta;
    }

    /* ---------- 列表 ---------- */
    function loadBox() {
      var m = boxFiles();
      files = Object.keys(m).map(function (n) {
        return { name: n, size: (m[n].content || "").length, at: m[n].at, src: "box" };
      });
      renderList();
    }
    async function syncRemote() {
      var btn = this;
      btn.textContent = "拉取中…";
      try {
        var list;
        if (RELAY) {
          var r = await fetch(RELAY + "/api/list");
          if (!r.ok) throw new Error("HTTP " + r.status);
          list = await r.json();
        } else {
          var r2 = await ghAnon("/repos/" + CFG.repo + "/contents/" + SUB);
          if (!r2.ok) throw new Error("HTTP " + r2.status + "（限流或无网络）");
          list = (await r2.json()).filter(function (f) { return f.name !== "README.md"; });
        }
        var m = boxFiles(), added = 0;
        for (var i = 0; i < list.length; i++) {
          var f = list[i];
          if (m[f.name]) continue;
          var content = "";
          try {
            if (RELAY) {
              var rr = await fetch(RELAY + "/api/read?name=" + encodeURIComponent(f.name));
              content = (await rr.json()).content || "";
            } else {
              var rr2 = await ghAnon("/repos/" + CFG.repo + "/contents/" + SUB + "/" + encodeURIComponent(f.name));
              if (rr2.ok) content = decodeURIComponent(escape(atob((await rr2.json()).content.replace(/\n/g, ""))));
            }
          } catch (e) { /* 内容稍后可再拉 */ }
          m[f.name] = { content: content, at: f.updated || new Date().toISOString() };
          added++;
        }
        if (!saveBoxFiles(m)) { btn.textContent = "☁ 拉取仓库 submissions/"; return; }
        queueNote = "已拉取 " + added + " 个远端文件进收件箱";
        loadBox();
      } catch (e) { queueNote = "拉取失败：" + e.message; }
      btn.textContent = "☁ 拉取仓库 submissions/";
    }

    function entryFor(name) {
      var m = name.match(/^(.+)-((?:WEB|CRYPTO|MISC|REVERSE|PWN)-\d+)\.md$/i);
      if (!m) return null;
      var nm = m[1], id = m[2].toUpperCase();
      return entries.find(function (e) {
        return e.id === id && (e.name || "").toLowerCase() === nm.toLowerCase();
      }) || null;
    }

    function renderList() {
      var host = $("#list");
      host.innerHTML = "";
      if (queueNote) { host.appendChild(el("p", "wp-muted", queueNote)); }
      var kw = $("#q").value.trim().toLowerCase();
      var shown = files.filter(function (f) { return !kw || f.name.toLowerCase().indexOf(kw) >= 0; });
      host.appendChild(el("p", "wp-kicker", "// 收件箱 · " + shown.length + " 篇 · 已审 " +
        shown.filter(function (f) { return entryFor(f.name); }).length + " 篇"));
      if (!shown.length) { host.appendChild(el("p", "wp-muted", "（空）把文件拖到上方虚线区开始审核。")); return; }
      shown.sort(function (a, b) { return b.name.localeCompare(a.name, "zh"); });
      shown.forEach(function (f) {
        var card = el("div", "rev-card");
        var meta = parseMd("", f.name);
        var st = entryFor(f.name);
        var ch = chById(meta.id);
        var head = el("div", "rev-head");
        head.innerHTML = "<b>" + f.name + "</b>" +
          "<span>" + (ch ? ch.title : (meta.id || "")) + "</span>" +
          "<span class='wp-badge " + (st ? (st.status === "accepted" ? "b-solved" : "b-cat") : "b-pending") + "'>" +
          (st ? (st.status === "accepted" ? "已通过 " + st.score + "分" : "已打回") : "待审核") + "</span>" +
          "<span class='wp-muted'>" + Math.round((f.size || 0) / 1024) + " KB</span>";
        card.appendChild(head);

        var body = el("div", "rev-body");
        body.hidden = true;
        var loaded = false;
        card.appendChild(body);

        var acts = el("div", "rev-actions");
        acts.appendChild(mkBtn("查看内容", "", function () {
          body.hidden = !body.hidden;
          if (loaded || body.hidden) return;
          var m2 = boxFiles()[f.name];
          body.textContent = (m2 && m2.content) || "（内容为空——点「☁ 拉取仓库」补全）";
          loaded = true;
        }));
        var sc = mkInput("number", "分数"); sc.value = ch ? ch.score : 20;
        var rs = mkInput("text", "打回理由（打回必填）"); rs.style.flex = "1"; rs.style.minWidth = "160px";
        acts.appendChild(sc); acts.appendChild(rs);
        acts.appendChild(mkBtn("通过", "is-primary", function () { decide(f.name, "accepted", parseInt(sc.value, 10) || (ch ? ch.score : 20), ""); }));
        acts.appendChild(mkBtn("打回", "", function () {
          if (!rs.value.trim()) { alert("打回必须写理由"); return; }
          decide(f.name, "rejected", 0, rs.value.trim());
        }));
        acts.appendChild(mkBtn("编辑", "", function () {
          var m3 = boxFiles(); var cur = (m3[f.name] || {}).content || "";
          var nt = window.prompt("编辑 " + f.name + " 内容（确定保存进收件箱）：", cur);
          if (nt === null) return;
          m3[f.name] = { content: nt, at: new Date().toISOString() };
          saveBoxFiles(m3); loadBox();
        }));
        acts.appendChild(mkBtn("删除", "", function () {
          if (!confirm("从收件箱删除 " + f.name + "？")) return;
          var m4 = boxFiles(); delete m4[f.name]; saveBoxFiles(m4); loadBox();
        }));
        card.appendChild(acts);
        host.appendChild(card);
      });
      renderPublished();
    }

    function decide(name, status, score, reason) {
      var meta = parseMd("", name);
      if (!meta.id) { alert("文件名无法解析题号"); return; }
      var ch = chById(meta.id);
      entries = entries.filter(function (e) {
        return !(e.id === meta.id && (e.name || "").toLowerCase() === (meta.name || "").toLowerCase());
      });
      entries.push({
        id: meta.id, github: meta.github || "", name: meta.name || "?",
        direction: ch ? ch.dir : "", status: status, score: score, reason: reason,
        at: new Date().toISOString(),
      });
      saveEntries();
      renderList();
    }

    function renderPublished() {
      $("#export").value = JSON.stringify({
        updated: new Date().toISOString(),
        note: "ZEROTHSEC 审核结果（教练管理页导出，勿手动改格式）",
        entries: entries,
      }, null, 2);
    }

    function mkBtn(t, cls, fn) { var b = el("button", "wp-btn is-mini " + (cls || ""), t); b.type = "button"; b.addEventListener("click", fn); return b; }
    function mkInput(type, ph) { var i = document.createElement("input"); i.type = type; i.placeholder = ph; if (type === "number") i.style.maxWidth = "80px"; return i; }
    function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

    /* ---------- 收件 ---------- */
    function addFiles(fileList) {
      var m = boxFiles(), n = 0;
      var pending = fileList.length;
      Array.prototype.forEach.call(fileList, function (f) {
        if (!/\.(md|markdown|txt)$/i.test(f.name)) { if (--pending === 0) { saveBoxFiles(m); loadBox(); } return; }
        var r = new FileReader();
        r.onload = function () {
          var text = String(r.result || "");
          var meta = parseMd(text, f.name);
          var key = meta.name && meta.id ? meta.name + "-" + meta.id + ".md" : f.name;
          m[key] = { content: text, at: new Date().toISOString() };
          if (--pending === 0) { if (saveBoxFiles(m)) n = 1; loadBox(); }
        };
        r.readAsText(f, "utf-8");
      });
      if (!fileList.length) return;
    }
    var drop = $("#drop");
    ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("on"); }); });
    ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("on"); }); });
    drop.addEventListener("drop", function (e) { addFiles(e.dataTransfer.files); });
    $("#picker").addEventListener("change", function () { addFiles(this.files); this.value = ""; });
    $("#toggle-paste").addEventListener("click", function () { $("#paste-box").hidden = !$("#paste-box").hidden; });
    $("#parse-paste").addEventListener("click", function () {
      var text = $("#paste-area").value;
      if (!text.trim()) return;
      var meta = parseMd(text, "");
      if (!meta.id) { alert("无法解析题号（需 ZSWP 头或标题含 <姓名>-<题号>.md）"); return; }
      var m = boxFiles();
      m[(meta.name || "?") + "-" + meta.id + ".md"] = { content: text, at: new Date().toISOString() };
      saveBoxFiles(m); $("#paste-area").value = ""; $("#paste-box").hidden = true; loadBox();
    });

    /* ---------- AI 辅助审查接口 ---------- */
    $("#ai-copy").addEventListener("click", function () {
      var pending = files.filter(function (f) { return !entryFor(f.name); });
      if (!pending.length) { alert("没有待审提交"); return; }
      var m = boxFiles();
      var lines = ["# ZEROTHSEC Writeup 待审包", "",
        "请逐篇评审以下 Writeup，评估是否真实、步骤是否清晰、结论是否正确。",
        "只输出结论行，每行一个 JSON，不要任何其他文字：",
        '{"name":"姓名","id":"题号","status":"accepted 或 rejected","score":分数,"reason":"一句评语或打回理由"}',
        "", "---", ""];
      pending.forEach(function (f) {
        var meta = parseMd("", f.name);
        var ch = chById(meta.id);
        lines.push("## " + f.name + "（题目：" + (ch ? ch.title : "?") + "，满分 " + (ch ? ch.score : "?") + "）");
        lines.push("```md"); lines.push(((m[f.name] || {}).content || "（内容为空，请先拉取仓库）").slice(0, 6000)); lines.push("```"); lines.push("");
      });
      var pkg = lines.join("\n");
      var b = this;
      if (navigator.clipboard) navigator.clipboard.writeText(pkg).then(function () {
        b.textContent = "已复制 " + pending.length + " 篇 ✓";
        setTimeout(function () { b.textContent = "🤖 复制待审 AI 包"; }, 2000);
      });
      else window.prompt("手动复制：", pkg);
    });
    $("#ai-import").addEventListener("click", function () {
      var t = window.prompt("粘贴 AI 输出的 JSON 结论（每行一个）：", "");
      if (!t) return;
      var n = 0;
      t.split(/\r?\n/).forEach(function (line) {
        line = line.trim();
        if (!line || line.indexOf("{") !== 0) return;
        try {
          var o = JSON.parse(line);
          if (!o.id) return;
          entries = entries.filter(function (e) {
            return !(e.id === o.id && (e.name || "").toLowerCase() === String(o.name || "").toLowerCase());
          });
          entries.push({
            id: o.id, github: "", name: o.name || "?",
            direction: (chById(o.id) || {}).dir || "",
            status: o.status === "rejected" ? "rejected" : "accepted",
            score: parseInt(o.score, 10) || 0, reason: o.reason || "",
            at: new Date().toISOString(),
          });
          n++;
        } catch (e) { /* 跳过非 JSON 行 */ }
      });
      saveEntries();
      alert("导入 " + n + " 条结论。核对后点「复制发布包」交给助手发布。");
      renderList();
    });

    $("#copy-out").addEventListener("click", function () {
      var b = this;
      navigator.clipboard.writeText($("#export").value).then(function () {
        b.textContent = "已复制 ✓ 发给助手说「发布结果」即可";
        setTimeout(function () { b.textContent = "复制发布包（results.json）"; }, 3000);
      });
    });
    $("#dl-out").addEventListener("click", function () {
      var blob = new Blob([$("#export").value], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "results.json"; a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 800);
    });
    $("#refresh").addEventListener("click", loadBox);
    $("#q").addEventListener("input", renderList);
    $("#sync-btn").addEventListener("click", syncRemote);

    /* ---------- 初始化 ---------- */
    window.ZSBank.loadBank().then(function (b) { bank = b; renderList(); }).catch(function (e) { console.warn(e); });
    loadBox();
  })();
  </script>
</body>
</html>
