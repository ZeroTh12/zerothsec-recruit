<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#0a0a0a">
  <title>ZS Console</title>
  <link rel="stylesheet" href="assets/css/main.css?v=20261105">
  <link rel="stylesheet" href="assets/css/at-template.css?v=20261109">
  <link rel="stylesheet" href="assets/css/writeup.css?v=20261117j">
  <style>
    .rev-card { border: 1px solid var(--line); background: var(--ink-2); padding: 14px 16px; margin-bottom: 14px; }
    .rev-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
    .rev-body { white-space: pre-wrap; font: 400 12.5px/1.7 var(--font-mono); color: var(--bone); background: #050505; border: 1px solid var(--line); padding: 12px; max-height: 420px; overflow: auto; margin-bottom: 8px; width: 100%; }
    textarea.rev-body { min-height: 260px; resize: vertical; }
    .rev-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .rev-actions input { background: #050505; color: var(--bone); border: 1px solid var(--line); padding: 7px 9px; font: 400 12px var(--font-mono); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0; }
    .toolbar input[type=search] { flex: 1; min-width: 200px; background: #050505; color: var(--bone); border: 1px solid var(--line); padding: 9px 12px; font: 400 12px var(--font-mono); }
    .secret-note { color: var(--red); font: 600 12px/1.7 var(--font-mono); }
    .key-gate { border: 1px solid var(--line-strong); padding: 16px; margin: 16px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .key-gate input { flex: 1; min-width: 220px; background: #050505; color: var(--bone); border: 1px solid var(--line); padding: 9px 12px; font: 400 12px var(--font-mono); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#" aria-label="ZS Console">
        <span class="brand-text">
          <span class="brand-name">ZS·CONSOLE</span>
          <span class="brand-sub">ZEROTHSEC Writeup 管理页 · 内部</span>
        </span>
      </a>
      <div class="head-actions">
        <span class="status"><i class="status-dot"></i>PRIVATE</span>
        <a class="btn btn-small" href="writeup.html">返回学生站 ↗</a>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="content-section wp-section">
      <div class="wrap">
        <span class="kicker">WRITEUP 管理 / 学生提交即入库，这里直接增删改查 + 审核</span>
        <p class="secret-note">此页地址请勿外发。学生上传的 .md 已经自动存进提交库，打开即见，不需要任何导入步骤。</p>

        <div class="key-gate" id="gate" hidden>
          <span class="wp-muted">首次使用请粘贴一次管理密钥（会记住）：</span>
          <input type="password" id="key-in" placeholder="管理密钥">
          <button class="wp-btn is-mini is-primary" type="button" id="key-save">进入</button>
        </div>

        <div class="toolbar">
          <input type="search" id="q" placeholder="搜索：姓名 / 题号…">
          <button class="wp-btn is-mini" type="button" id="refresh">⟳ 刷新</button>
          <button class="wp-btn is-mini" type="button" id="ai-copy">🤖 复制待审 AI 包</button>
          <button class="wp-btn is-mini" type="button" id="ai-import">📥 导入 AI 结论</button>
        </div>

        <div id="list"><p class="wp-muted">加载中…</p></div>
      </div>
    </section>
  </main>

  <script src="assets/js/wp-config.js?v=20261118a"></script>
  <script>
  (function () {
    "use strict";
    var CFG = window.WP_CONFIG || {};
    var $ = function (s) { return document.querySelector(s); };
    var RELAY = (CFG.relay || "").replace(/\/+$/, "");
    var KEY = "";
    var files = [], entries = [];

    function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
    function saveKey(k) { try { localStorage.setItem("zs-coach-key", k); } catch (e) { /* ignore */ } }

    /* 密钥：优先 URL 片段 #k=xxx（不进服务器日志），其次本机记忆 */
    (function () {
      var m = (location.hash || "").match(/k=([^&]+)/);
      if (m) { KEY = decodeURIComponent(m[1]); saveKey(KEY); return; }
      try { KEY = localStorage.getItem("zs-coach-key") || ""; } catch (e) { KEY = ""; }
    })();

    function api(path, opt) {
      opt = opt || {};
      return fetch(RELAY + path, {
        method: opt.method || "GET",
        headers: Object.assign({ "x-coach-key": KEY }, opt.body ? { "Content-Type": "application/json" } : {}),
        body: opt.body ? JSON.stringify(opt.body) : undefined
      }).then(function (r) {
        return r.json().then(function (d) {
          if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
          return d;
        });
      });
    }

    function chOf(n) { var m = n.match(/-(WEB|CRYPTO|MISC|REVERSE|PWN)-(\d+)\.md$/i); return m ? (m[1].toUpperCase() + "-" + m[2]) : ""; }
    function nmOf(n) { var m = n.match(/^(.+)-(WEB|CRYPTO|MISC|REVERSE|PWN)-\d+\.md$/i); return m ? m[1] : n.replace(/\.md$/i, ""); }
    function entOf(n) {
      var id = chOf(n), nm = nmOf(n);
      return entries.find(function (e) {
        return e.id === id && String(e.name || "").toLowerCase() === nm.toLowerCase();
      }) || null;
    }

    async function load() {
      if (!RELAY) {
        $("#list").innerHTML = '<p class="wp-muted">提交库地址未配置：请在 assets/js/wp-config.js 里填好 relay。</p>';
        return;
      }
      try {
        files = await api("/api/list");
        var st = await api("/api/state");
        entries = st.entries || [];
        render();
      } catch (e) {
        $("#list").innerHTML = "";
        $("#list").appendChild(el("p", "secret-note", "读取失败：" + e.message));
      }
    }

    function render() {
      var host = $("#list");
      host.innerHTML = "";
      var kw = ($("#q").value || "").trim().toLowerCase();
      var shown = files.filter(function (f) { return !kw || f.name.toLowerCase().indexOf(kw) >= 0; });
      var done = files.filter(function (f) { return entOf(f.name); }).length;
      host.appendChild(el("p", "wp-kicker", "// 提交库 · " + files.length + " 篇 · 已审 " + done + " 篇 · 待审 " + (files.length - done) + " 篇"));
      if (!shown.length) { host.appendChild(el("p", "wp-muted", files.length ? "没有匹配的文件。" : "还没有学生提交。")); return; }
      shown.sort(function (a, b) { return String(b.updated || "").localeCompare(String(a.updated || "")); });
      shown.forEach(function (f) { host.appendChild(card(f)); });
    }

    function card(f) {
      var c = el("div", "rev-card");
      var st = entOf(f.name);

      var head = el("div", "rev-head");
      head.appendChild(el("b", null, f.name));
      head.appendChild(el("span", "wp-badge b-cat", chOf(f.name) || "—"));
      var badge = el("span", "wp-badge " + (st ? (st.status === "accepted" ? "b-solved" : "b-pending") : "b-pending"),
        st ? (st.status === "accepted" ? "已通过 " + (st.score || 0) + " 分" : "已打回") : "待审核");
      head.appendChild(badge);
      head.appendChild(el("span", "wp-muted", (f.size || 0) + " B"));
      if (st && st.reason) head.appendChild(el("span", "wp-muted", "理由：" + st.reason));
      c.appendChild(head);

      var view = el("pre", "rev-body", "（点「查看」加载正文）");
      view.hidden = true;
      c.appendChild(view);

      var files2 = el("div", "rev-actions");
      var viewBtn = el("button", "wp-btn is-mini", "查看");
      viewBtn.type = "button";
      viewBtn.onclick = async function () {
        if (!view.hidden) { view.hidden = true; viewBtn.textContent = "查看"; return; }
        viewBtn.textContent = "载入中…";
        try {
          var d = await api("/api/read?name=" + encodeURIComponent(f.name));
          view.textContent = d.content;
          view.hidden = false;
          viewBtn.textContent = "收起";
        } catch (err) {
          view.textContent = "读取失败：" + err.message;
          view.hidden = false;
          viewBtn.textContent = "收起";
        }
      };

      var score = el("input");
      score.type = "number"; score.min = "0"; score.max = "100"; score.placeholder = "分数";
      score.style.maxWidth = "88px";
      score.value = st && st.score ? st.score : "";

      var reason = el("input");
      reason.type = "text"; reason.placeholder = "打回理由（可选）";
      reason.style.flex = "1"; reason.style.minWidth = "150px";
      reason.value = st && st.reason ? st.reason : "";

      var pass = el("button", "wp-btn is-mini is-primary", "✓ 通过");
      pass.type = "button";
      pass.onclick = function () { decide(f.name, "accepted", Number(score.value) || 0, ""); };

      var reject = el("button", "wp-btn is-mini", "✗ 打回");
      reject.type = "button";
      reject.onclick = function () { decide(f.name, "rejected", 0, reason.value.trim()); };

      var edit = el("button", "wp-btn is-mini", "编辑");
      edit.type = "button";
      var save = el("button", "wp-btn is-mini is-primary", "保存修改");
      save.type = "button"; save.hidden = true;

      var ta = el("textarea", "rev-body");
      ta.hidden = true;
      c.appendChild(ta);

      edit.onclick = async function () {
        if (!ta.hidden) { ta.hidden = true; save.hidden = true; edit.textContent = "编辑"; return; }
        ta.value = "载入中…"; ta.hidden = false; save.hidden = true;
        try {
          var d = await api("/api/read?name=" + encodeURIComponent(f.name));
          ta.value = d.content; save.hidden = false; edit.textContent = "取消编辑";
        } catch (err) { ta.value = "读取失败：" + err.message; }
      };
      save.onclick = async function () {
        save.disabled = true; save.textContent = "保存中…";
        try {
          await api("/api/save", { method: "POST", body: { name: f.name, content: ta.value } });
          ta.hidden = true; save.hidden = true; edit.textContent = "编辑";
          view.textContent = ta.value; view.hidden = false;
          save.textContent = "保存修改"; save.disabled = false;
          alert("已保存");
        } catch (err) { alert("保存失败：" + err.message); save.textContent = "保存修改"; save.disabled = false; }
      };

      var del = el("button", "wp-btn is-mini", "删除");
      del.type = "button";
      del.onclick = function () {
        if (!confirm("确定删除 " + f.name + "？此操作会同时删除仓库里的文件。")) return;
        api("/api/delete", { method: "POST", body: { name: f.name } })
          .then(load)
          .catch(function (err) { alert("删除失败：" + err.message); });
      };

      [viewBtn, score, pass, reason, reject, edit, save, del].forEach(function (x) { files2.appendChild(x); });
      c.appendChild(files2);
      return c;
    }

    async function decide(name, status, score, reason) {
      try {
        await api("/api/decide", { method: "POST", body: { name: name, status: status, score: Number(score) || 0, reason: reason || "" } });
        await load();
      } catch (e) { alert("写入失败：" + e.message); }
    }

    $("#q").addEventListener("input", render);
    $("#refresh").addEventListener("click", load);

    /* AI 辅助：把待审内容打包复制，审完把 JSON 结论贴回来，一键写入 */
    $("#ai-copy").addEventListener("click", async function () {
      var btn = this;
      var pending = files.filter(function (f) { return !entOf(f.name); });
      if (!pending.length) { alert("没有待审提交"); return; }
      btn.disabled = true; btn.textContent = "打包中…";
      var parts = [];
      for (var i = 0; i < pending.length; i++) {
        var f = pending[i];
        try {
          var d = await api("/api/read?name=" + encodeURIComponent(f.name));
          parts.push("=== " + f.name + " ===\n" + d.content);
        } catch (e) { /* 跳过读取失败 */ }
      }
      var pkg = "# ZEROTHSEC Writeup 待审包\n\n" +
        "请逐篇评审：是否真实完成题目、步骤是否可复现、flag 是否与题目一致、有无抄袭。\n" +
        "只输出结论行，每行一个 JSON，不要任何其他文字：\n" +
        '{"name":"文件名.md","status":"accepted","score":0,"reason":"一句话理由"}\n\n' + parts.join("\n\n");
      try {
        await navigator.clipboard.writeText(pkg);
        btn.textContent = "已复制 " + parts.length + " 篇 ✓";
      } catch (e) { prompt("复制以下内容：", pkg); btn.textContent = "🤖 复制待审 AI 包"; }
      setTimeout(function () { btn.textContent = "🤖 复制待审 AI 包"; btn.disabled = false; }, 2200);
    });

    $("#ai-import").addEventListener("click", async function () {
      var t = window.prompt("粘贴 AI 输出的 JSON 结论（每行一个）：", "");
      if (!t) return;
      var n = 0, fails = 0;
      var lines = t.split(/\r?\n/);
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line || line.charAt(0) !== "{") continue;
        try {
          var o = JSON.parse(line);
          if (!o.name) continue;
          await api("/api/decide", {
            method: "POST",
            body: {
              name: o.name,
              status: o.status === "rejected" ? "rejected" : "accepted",
              score: Number(o.score) || 0,
              reason: o.reason || ""
            }
          });
          n++;
        } catch (e) { fails++; }
      }
      await load();
      alert("导入成功 " + n + " 条" + (fails ? "，失败 " + fails + " 条" : "") + "。");
    });

    /* 密钥门 */
    if (!KEY) {
      $("#gate").hidden = false;
      $("#key-save").addEventListener("click", function () {
        var v = $("#key-in").value.trim();
        if (!v) return;
        KEY = v; saveKey(v); $("#gate").hidden = true; load();
      });
    }

    load();
  })();
  </script>
</body>
</html>
